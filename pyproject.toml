[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "smart-grid-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "uvicorn>=0.35.0",
]

[tool.uv]
package = false

[dependency-groups]
demo = [
    "imageio-ffmpeg>=0.6.0",
    "pillow>=11.3.0",
]
